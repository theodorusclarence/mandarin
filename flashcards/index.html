<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chinese Flashcards</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f0eb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 24px 48px;
      color: #1a1a1a;
    }

    /* ── Lesson selector ── */
    .lesson-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 28px;
      width: min(500px, 100%);
    }

    .lesson-pill {
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 20px;
      background: #fff;
      color: #666;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      transition: all 0.15s;
      white-space: nowrap;
    }

    .lesson-pill:hover { background: #eee; color: #333; }

    .lesson-pill.active {
      background: #1a1a1a;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* ── Counter ── */
    .counter {
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 16px;
      text-align: center;
    }

    /* ── Card ── */
    .card {
      width: min(440px, 100%);
      min-height: 300px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 32px;
      cursor: pointer;
      user-select: none;
      position: relative;
    }

    /* Front state */
    .card-front,
    .card-back {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-back { display: none; }

    .card.revealed .card-front { display: none; }
    .card.revealed .card-back  { display: flex; }

    /* Front content */
    .hanzi {
      font-size: 72px;
      font-weight: 400;
      line-height: 1.1;
      text-align: center;
    }

    .hint {
      margin-top: 14px;
      font-size: 0.75rem;
      color: #ccc;
      letter-spacing: 0.04em;
    }

    /* Back content */
    .pinyin {
      font-size: 1.5rem;
      color: #c0392b;
      font-weight: 500;
      margin-bottom: 6px;
      text-align: center;
    }

    .meaning {
      font-size: 1.05rem;
      color: #333;
      font-weight: 500;
      text-align: center;
      margin-bottom: 16px;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: #eee;
      margin-bottom: 16px;
    }

    .usage-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .usage-item {
      position: relative;
    }

    /* Extend hover zone downward to cover where pinyin will appear,
       preventing flicker caused by layout shift on reveal */
    .usage-item::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: -2.5em;
    }

    .usage-zh {
      font-size: 1.2rem;
      color: #333;
      line-height: 1.6;
    }

    .usage-pinyin {
      font-size: 0.76rem;
      color: #c0392b;
      margin-top: 1px;
      line-height: 1.4;
      opacity: 0;
      height: 0;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }

    .usage-item:hover .usage-pinyin,
    .usage-item.pinyin-visible .usage-pinyin {
      opacity: 1;
      height: auto;
      overflow: visible;
    }

    .usage-pinyin-hint {
      font-size: 0.68rem;
      color: #ccc;
      margin-top: 2px;
      letter-spacing: 0.03em;
    }

    .usage-item:hover .usage-pinyin-hint,
    .usage-item.pinyin-visible .usage-pinyin-hint {
      display: none;
    }

    .usage-en {
      font-size: 0.76rem;
      color: #999;
      margin-top: 1px;
      line-height: 1.4;
    }

    /* ── Progress bar ── */
    .progress-bar {
      width: min(440px, 100%);
      height: 3px;
      background: #e5dfd8;
      border-radius: 2px;
      margin-top: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #1a1a1a;
      border-radius: 2px;
      transition: width 0.25s ease;
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 24px;
    }

    button { border: none; cursor: pointer; font-family: inherit; transition: all 0.15s; }

    .btn-nav {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.09);
      font-size: 1.1rem;
      color: #555;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-nav:hover  { background: #eee; }
    .btn-nav:active { transform: scale(0.93); }

    .btn-reveal {
      padding: 12px 28px;
      border-radius: 24px;
      background: #1a1a1a;
      color: #fff;
      font-size: 0.88rem;
      font-weight: 500;
      min-width: 110px;
    }

    .btn-reveal:hover  { background: #333; }
    .btn-reveal:active { transform: scale(0.97); }

    .btn-shuffle {
      padding: 9px 16px;
      border-radius: 20px;
      background: transparent;
      border: 1.5px solid #ddd;
      color: #888;
      font-size: 0.78rem;
      margin-top: 14px;
    }

    .btn-shuffle:hover { border-color: #aaa; color: #444; }

    .kbd-hint {
      font-size: 0.7rem;
      color: #bbb;
      margin-top: 12px;
    }

    .kbd {
      background: #eee;
      border-radius: 3px;
      padding: 1px 5px;
      font-family: monospace;
      font-size: 0.68rem;
      color: #999;
    }
  </style>
</head>
<body>

  <!-- Lesson selector -->
  <div class="lesson-bar" id="lesson-bar"></div>

  <!-- Counter -->
  <div class="counter" id="counter">1 / 30</div>

  <!-- Card -->
  <div class="card" id="card" onclick="toggleReveal()">
    <div class="card-front">
      <div class="hanzi" id="hanzi"></div>
      <div class="hint">tap to reveal</div>
    </div>
    <div class="card-back">
      <div class="pinyin"  id="pinyin"></div>
      <div class="meaning" id="meaning"></div>
      <div class="divider" id="divider"></div>
      <div class="usage-section" id="usage-section"></div>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn-nav"    onclick="prevCard(); event.stopPropagation()">←</button>
    <button class="btn-reveal" id="btn-reveal" onclick="toggleReveal(); event.stopPropagation()">Reveal</button>
    <button class="btn-nav"    onclick="nextCard(); event.stopPropagation()">→</button>
  </div>

  <button class="btn-shuffle" onclick="shuffleCards()">⇄ Shuffle</button>

  <div class="kbd-hint">
    <kbd class="kbd">Space</kbd> reveal / next &nbsp;
    <kbd class="kbd">O</kbd> toggle &nbsp;
    <kbd class="kbd">S</kbd> shuffle &nbsp;
    <kbd class="kbd">←</kbd> <kbd class="kbd">→</kbd> navigate
  </div>

// ── Helpers ──────────────────────────────────────────

function parseLessonDate(lessonKey) {
  // e.g. "Slides_20260408" → Date
  const match = lessonKey.match(/(\d{4})(\d{2})(\d{2})/);
  if (!match) return null;
  return new Date(parseInt(match[1]), parseInt(match[2]) - 1, parseInt(match[3]));
}

function formatLessonDate(lessonKey) {
  const d = parseLessonDate(lessonKey);
  if (!d) return lessonKey;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function uniqueLessons() {
  const seen = new Set();
  const out  = [];
  for (const w of ALL_VOCAB) {
    if (!seen.has(w.lesson)) { seen.add(w.lesson); out.push(w.lesson); }
  }
  // Sort chronologically
  out.sort((a, b) => {
    const da = parseLessonDate(a), db = parseLessonDate(b);
    return (da || 0) - (db || 0);
  });
  return out;
}

// ── State ────────────────────────────────────────────

let activeLesson = 'all';
let deck         = [];
let currentIndex = 0;
let revealed     = false;

// ── Lesson bar ───────────────────────────────────────

function buildLessonBar() {
  const bar     = document.getElementById('lesson-bar');
  const lessons = uniqueLessons();

  bar.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className   = 'lesson-pill active';
  allBtn.textContent = 'All lessons';
  allBtn.dataset.key = 'all';
  allBtn.onclick = () => selectLesson('all');
  bar.appendChild(allBtn);

  for (const key of lessons) {
    const btn = document.createElement('button');
    btn.className   = 'lesson-pill';
    btn.textContent = formatLessonDate(key);
    btn.dataset.key = key;
    btn.onclick = () => selectLesson(key);
    bar.appendChild(btn);
  }
}

function selectLesson(key) {
  activeLesson = key;

  // Update pill styles
  document.querySelectorAll('.lesson-pill').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.key === key);
  });

  // Filter deck
  deck = key === 'all'
    ? [...ALL_VOCAB]
    : ALL_VOCAB.filter(w => w.lesson === key);

  currentIndex = 0;
  renderCard();
}

// ── Card rendering ───────────────────────────────────

function renderCard() {
  if (deck.length === 0) return;
  const word = deck[currentIndex];

  document.getElementById('hanzi').textContent  = word.hanzi;
  document.getElementById('pinyin').textContent  = word.pinyin;
  document.getElementById('meaning').textContent = word.meaning;
  document.getElementById('counter').textContent = `${currentIndex + 1} / ${deck.length}`;

  const usageEl  = document.getElementById('usage-section');
  const dividerEl = document.getElementById('divider');

  if (word.usage && word.usage.length > 0) {
    usageEl.innerHTML = word.usage.map(u =>
      `<div class="usage-item" onclick="this.classList.toggle('pinyin-visible')">
        <div class="usage-zh">${u.zh}</div>
        ${u.pinyin ? `<div class="usage-pinyin">${u.pinyin}</div><div class="usage-pinyin-hint">hover for pinyin</div>` : ''}
        <div class="usage-en">${u.en}</div>
       </div>`
    ).join('');
    dividerEl.style.display = 'block';
  } else {
    usageEl.innerHTML = '';
    dividerEl.style.display = 'none';
  }

  // Progress bar
  document.getElementById('progress-fill').style.width =
    ((currentIndex + 1) / deck.length * 100) + '%';

  // Reset to front
  setRevealed(false);
}

function setRevealed(val) {
  revealed = val;
  const card = document.getElementById('card');
  card.classList.toggle('revealed', revealed);
  document.getElementById('btn-reveal').textContent = revealed ? 'Hide' : 'Reveal';
}

function toggleReveal() { setRevealed(!revealed); }

function nextCard() {
  currentIndex = (currentIndex + 1) % deck.length;
  renderCard();
}

function prevCard() {
  currentIndex = (currentIndex - 1 + deck.length) % deck.length;
  renderCard();
}

function shuffleCards() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  currentIndex = 0;
  renderCard();
}

// ── Keyboard ─────────────────────────────────────────

document.addEventListener('keydown', e => {
  if (e.key === ' ') {
    e.preventDefault();
    if (revealed) nextCard(); else setRevealed(true);
  }
  if (e.key === 'o' || e.key === 'O') toggleReveal();
  if (e.key === 's' || e.key === 'S') shuffleCards();
  if (e.key === 'ArrowRight') nextCard();
  if (e.key === 'ArrowLeft') { if (revealed) setRevealed(false); else prevCard(); }
});

// ── Init ─────────────────────────────────────────────

buildLessonBar();
selectLesson('all');
</script>
</body>
</html>
